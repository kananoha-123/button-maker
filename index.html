<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>缶バッジデザイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Zen+Maru+Gothic:wght@700&family=Kiwi+Maru&family=Hachi+Maru+Pop&family=Mochiy+Pop+One&family=Yusei+Magic&family=Yomogi&family=DotGothic16&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{--navy:#313869;--teal:#3D7187;--cream:#EEE9D9;--red:#A72E21;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--cream);color:var(--navy);font:16px/1.5 "Noto Sans JP",sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;min-height:44px;min-width:44px;border-radius:10px;border:2px solid transparent;background:none;padding:0 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.pri{background:var(--navy);color:var(--cream);font-weight:700}
.sec{border-color:var(--teal);background:var(--cream)}
.dan{background:var(--red);color:var(--cream);font-weight:700}
button:disabled{opacity:.4}
#top{display:flex;align-items:center;gap:4px;padding:8px;justify-content:space-between}#top button{padding:0 8px}#top .r{display:flex;gap:6px}
#top .l{display:flex;gap:4px;align-items:center}
#cnt{font-weight:700;border-color:var(--teal);background:var(--cream);padding:0 10px}
#stage{flex:1;min-height:0;background:var(--navy);display:flex;align-items:center;justify-content:center;position:relative}
#cv{touch-action:none;display:block}
#del{position:absolute;right:12px;bottom:12px}
#tabs{display:flex;border-top:2px solid var(--navy)}
#tabs button{flex:1;border-radius:0;border:0;border-bottom:4px solid transparent;padding:0 2px;min-height:48px}
#tabs button[aria-selected=true]{border-bottom-color:var(--teal);font-weight:700}
#tabs button[aria-selected=true]::before{content:"✓ "}
#panel{padding:10px 12px;max-height:40dvh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.scr{overflow-x:auto;padding:2px}
.scr>*{flex:none}
.sw{width:44px;border-radius:50%;border:2px solid var(--navy);padding:0;font-weight:700;font-size:20px;line-height:1}
.sw[aria-pressed=true]{outline:3px solid var(--teal);outline-offset:2px}
.chip{border-color:var(--navy)}
.chip[aria-pressed=true]{border-color:var(--teal);border-width:2px;border-bottom-width:5px;font-weight:700}
.chip[aria-pressed=true]::before{content:"✓ "}
.sw[aria-pressed=true]::before{content:""}
.stp{width:56px;padding:4px;border-color:var(--navy)}
.stp img{width:100%;height:100%;display:block;pointer-events:none}
input[type=text]{flex:1;min-width:0;min-height:44px;font:inherit;border:2px solid var(--navy);border-radius:10px;padding:0 10px;background:#fff;color:var(--navy);-webkit-user-select:text;user-select:text}
.note{margin:0;font-size:16px}
#ov{position:fixed;inset:0;background:rgba(49,56,105,.85);display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#ov.on{display:flex}
.box{background:var(--cream);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-size:20px}
.box p{margin:0}
.box img{width:100%;border:2px solid var(--navy);background:#fff;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.box .btns{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="top">
  <div class="l"><button id="cnt" aria-label="作ったバッジを切り替える"></button><button id="undo" class="sec" aria-label="元に戻す">↶</button><button id="redo" class="sec" aria-label="やり直す">↷</button></div>
  <div class="r"><button id="clr" class="dan">全部消す</button><button id="done" class="pri">完成</button></div>
</div>
<div id="stage"><canvas id="cv" width="830" height="830" aria-label="バッジのキャンバス"></canvas><button id="del" class="dan" hidden>削除</button></div>
<div id="tabs" role="tablist"></div>
<div id="panel"></div>
<div id="ov" role="dialog" aria-modal="true"><div class="box" id="box"></div></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<script>
const D=830,R=415;
const $=s=>document.querySelector(s);
const PEN=['#000000','#FFFFFF','#E8416B','#F5A623','#F7DC3E','#4CB782','#4AA3E0','#8E5BD6'];
const BGS=[['ピンク','#FFD6E0'],['ピーチ','#FFE3CC'],['レモン','#FFF5C2'],['ミント','#D3F0E0'],['スカイ','#D0E8FA'],['ラベンダー','#E3D9F5']];
const FONTS=[['Zen Maru Gothic',700],['Kiwi Maru',400],['Hachi Maru Pop',400],['Mochiy Pop One',400],['Yusei Magic',400],['Yomogi',400],['DotGothic16',400],['Dela Gothic One',400]];
const WID=[6,16,34],SZN=['細','中','太'];
const TABS=[['pen','ペン'],['img','画像'],['stp','スタンプ'],['txt','文字'],['bg','背景']];
const svg=b=>'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 88 88">'+b+'</svg>');
const petals=[0,72,144,216,288].map(a=>`<circle cx="${50+27*Math.sin(a*Math.PI/180)}" cy="${50-27*Math.cos(a*Math.PI/180)}" r="19" fill="#F28DB2"/>`).join('');
const STAMPS=[
 '<path d="M50 88C10 58 12 28 32 24c10-2 16 4 18 10 2-6 8-12 18-10 20 4 22 34-18 64z" fill="#E8416B"/>',
 '<polygon points="50,8 61,38 93,38 67,57 77,89 50,70 23,89 33,57 7,38 39,38" fill="#F7B92E"/>',
 petals+'<circle cx="50" cy="50" r="14" fill="#F7DC3E"/>',
 '<circle cx="50" cy="50" r="36" fill="none" stroke="#F5A623" stroke-width="12" stroke-dasharray="7 14"/><circle cx="50" cy="50" r="24" fill="#F5A623"/>',
 '<circle cx="34" cy="58" r="22" fill="#8FC9F0"/><circle cx="58" cy="48" r="26" fill="#8FC9F0"/><circle cx="76" cy="62" r="18" fill="#8FC9F0"/><rect x="34" y="58" width="42" height="22" fill="#8FC9F0"/>',
 '<path d="M62 8a42 42 0 1 0 30 64A36 36 0 0 1 62 8z" fill="#F7DC3E"/>',
 '<path d="M50 4 59 41 96 50 59 59 50 96 41 59 4 50 41 41z" fill="#8E5BD6"/>',
 '<circle cx="50" cy="50" r="42" fill="#F7DC3E" stroke="#313869" stroke-width="5"/><circle cx="36" cy="42" r="5" fill="#313869"/><circle cx="64" cy="42" r="5" fill="#313869"/><path d="M30 60q20 22 40 0" fill="none" stroke="#313869" stroke-width="5" stroke-linecap="round"/>'
].map(svg);

/* ---------- state ---------- */
const mk=(bg,items)=>{const b={bg:bg||'#FFFFFF',items:items||[],hist:[],hi:0};b.hist=[snap(b)];return b};
const snap=b=>({bg:b.bg,items:b.items.map(i=>({...i}))});
let S={cur:0,badges:[mk()]},U={tool:'pen',color:PEN[0],size:1,erase:false,font:0,tc:PEN[0],outline:true,txt:''},sel=null;
try{const j=JSON.parse(localStorage.getItem('kbj1')||'null');if(j&&j.badges&&j.badges.length){S.badges=j.badges.slice(0,3).map(b=>mk(b.bg,b.items));S.cur=Math.min(j.cur||0,S.badges.length-1)}}catch(e){}
const B=()=>S.badges[S.cur];
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{localStorage.setItem('kbj1',JSON.stringify({cur:S.cur,badges:S.badges.map(b=>({bg:b.bg,items:b.items}))}))}catch(e){}},400)}
function commit(){const b=B();b.hist=b.hist.slice(0,b.hi+1);b.hist.push(snap(b));if(b.hist.length>40)b.hist.shift();b.hi=b.hist.length-1;save();ui()}
function jump(d){const b=B(),n=b.hi+d;if(n<0||n>=b.hist.length)return;b.hi=n;const s=b.hist[n];b.bg=s.bg;b.items=s.items.map(i=>({...i}));sel=null;save();ui()}

/* ---------- drawing ---------- */
const cv=$('#cv'),x2=cv.getContext('2d'),mc=document.createElement('canvas').getContext('2d');
const IM={};const getImg=s=>IM[s]||(IM[s]=Object.assign(new Image(),{src:s,onload:render}));
const fnt=i=>`${FONTS[i.f][1]} 100px "${FONTS[i.f][0]}",sans-serif`;
function size(i){if(i.t==='txt'){mc.font=fnt(i);return[mc.measureText(i.text||' ').width+20,130]}return[i.w,i.h]}
function drawItem(c,i,bg){
 if(i.t==='stroke'){c.globalCompositeOperation=i.e?'destination-out':'source-over';c.strokeStyle=i.c;c.lineWidth=i.w;c.lineCap=c.lineJoin='round';c.beginPath();c.moveTo(i.p[0],i.p[1]);for(let k=2;k<i.p.length;k+=2)c.lineTo(i.p[k],i.p[k+1]);if(i.p.length===2)c.lineTo(i.p[0]+.01,i.p[1]);c.stroke();c.globalCompositeOperation='source-over';return}
 c.save();c.translate(i.x,i.y);c.rotate(i.r);c.scale(i.s,i.s);
 if(i.t==='txt'){c.font=fnt(i);c.textAlign='center';c.textBaseline='middle';if(i.o){c.strokeStyle='#fff';c.lineWidth=20;c.lineJoin='round';c.strokeText(i.text,0,0)}c.fillStyle=i.c;c.fillText(i.text,0,0)}
 else{const m=getImg(i.src);if(m.complete&&m.naturalWidth)c.drawImage(m,-i.w/2,-i.h/2,i.w,i.h)}
 c.restore()}
const TC=document.createElement('canvas'),T2=TC.getContext('2d');
function draw(c,b,d){c.save();c.scale(d/D,d/D);c.beginPath();c.arc(R,R,R,0,7);c.clip();c.fillStyle=b.bg;c.fillRect(0,0,D,D);
 const it=b.items;
 if(!it.some(i=>i.e))it.forEach(i=>drawItem(c,i));
 else{/* 消しゴムは線だけを消し、写真・文字・スタンプは消さない */
  let k=0;while(k<it.length){
   if(it[k].t!=='stroke'){drawItem(c,it[k]);k++;continue}
   let e=k;while(e<it.length&&it[e].t==='stroke')e++;
   if(TC.width!==Math.round(d)){TC.width=TC.height=Math.round(d)}
   T2.setTransform(1,0,0,1,0,0);T2.clearRect(0,0,TC.width,TC.height);T2.scale(TC.width/D,TC.width/D);
   for(let j=k;j<e;j++)drawItem(T2,it[j]);
   for(let j=e;j<it.length;j++)if(it[j].e)drawItem(T2,it[j]);
   c.drawImage(TC,0,0,D,D);k=e}}
 c.restore()}
let raf;function render(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
 x2.clearRect(0,0,D,D);const b=B();draw(x2,b,D);
 x2.lineWidth=4;x2.setLineDash([]);x2.strokeStyle='#fff';x2.beginPath();x2.arc(R,R,R*.8,0,7);x2.stroke();
 x2.setLineDash([14,12]);x2.strokeStyle='#313869';x2.beginPath();x2.arc(R,R,R*.8,0,7);x2.stroke();x2.setLineDash([]);
 if(sel&&b.items.includes(sel)){const[w,h]=size(sel);x2.save();x2.translate(sel.x,sel.y);x2.rotate(sel.r);x2.scale(sel.s,sel.s);const p=3/sel.s;
  x2.lineWidth=5/sel.s;x2.strokeStyle='#fff';x2.strokeRect(-w/2-p,-h/2-p,w+2*p,h+2*p);x2.setLineDash([16/sel.s,10/sel.s]);x2.strokeStyle='#3D7187';x2.strokeRect(-w/2-p,-h/2-p,w+2*p,h+2*p);x2.restore();x2.setLineDash([])}
})}
function fit(){const s=$('#stage');const d=Math.floor(Math.min(s.clientWidth,s.clientHeight));cv.style.width=cv.style.height=d+'px'}
addEventListener('resize',fit);

/* ---------- pointer ---------- */
const P=new Map();let g=null,drawing=null,changed=false;
const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*D,y:(e.clientY-r.top)/r.height*D}};
function hit(p){const it=B().items;for(let k=it.length-1;k>=0;k--){const i=it[k];if(i.t==='stroke')continue;const dx=p.x-i.x,dy=p.y-i.y,c=Math.cos(i.r),s=Math.sin(i.r);const lx=(dx*c+dy*s)/i.s,ly=(-dx*s+dy*c)/i.s,[w,h]=size(i);if(Math.abs(lx)<=w/2+24/i.s&&Math.abs(ly)<=h/2+24/i.s)return i}return null}
const two=()=>{const[a,b]=[...P.values()];return{d:Math.hypot(b.x-a.x,b.y-a.y)||1,a:Math.atan2(b.y-a.y,b.x-a.x),mx:(a.x+b.x)/2,my:(a.y+b.y)/2}};
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(e);P.set(e.pointerId,p);const b=B();
 if(U.tool==='pen'){if(P.size>1)return;drawing={t:'stroke',c:U.color,e:U.erase,w:WID[U.size]*(U.erase?1.7:1),p:[p.x,p.y]};b.items.push(drawing);sel=null;render();return}
 if(P.size===1){const h=hit(p);if(h){sel=h;b.items.splice(b.items.indexOf(h),1);b.items.push(h);g={single:1};changed=false;if(h.t==='txt'){U.tool='txt';U.txt=h.text;U.font=h.f;U.tc=h.c;U.outline=h.o}ui()}else{sel=null;g=null;ui()}}
 else if(sel&&P.size===2){const t=two();g={...t,s:sel.s,r:sel.r,x:sel.x,y:sel.y}}
 render()});
cv.addEventListener('pointermove',e=>{
 if(!P.has(e.pointerId))return;const p=pt(e),o=P.get(e.pointerId);P.set(e.pointerId,p);
 if(drawing){const l=drawing.p;if(Math.hypot(p.x-l[l.length-2],p.y-l[l.length-1])>2){l.push(p.x,p.y);render()}return}
 if(!sel||!g)return;
 if(P.size===1&&g.single){sel.x+=p.x-o.x;sel.y+=p.y-o.y}
 else if(P.size>=2&&!g.single){const t=two();sel.s=Math.max(.1,Math.min(8,g.s*t.d/g.d));sel.r=g.r+(t.a-g.a);sel.x=g.x+t.mx-g.mx;sel.y=g.y+t.my-g.my}
 else return;
 changed=true;render()});
const up=e=>{
 if(!P.has(e.pointerId))return;P.delete(e.pointerId);
 if(drawing){drawing=null;commit();render();return}
 if(P.size===1&&sel){g={single:1}}else if(P.size===0){if(changed){changed=false;commit()}g=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

/* ---------- actions ---------- */
function addItem(i){const b=B();b.items.push(i);sel=i;commit();render()}
async function addImages(files){
 const b=B();let room=5-b.items.filter(i=>i.t==='img').length;
 for(const f of [...files]){if(room<=0){dlg('写真は5枚までです','1個のバッジに入れられる写真は5枚までです。いらない写真を削除してから追加してください。',[['とじる','pri']]);break}
  try{const url=URL.createObjectURL(f),im=await new Promise((ok,ng)=>{const m=new Image();m.onload=()=>ok(m);m.onerror=ng;m.src=url});
   const k=Math.min(1,720/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
   const q=Math.min(1,420/Math.max(c.width,c.height));room--;
   addItem({t:'img',src:c.toDataURL('image/jpeg',.85),w:c.width*q,h:c.height*q,x:R,y:R,s:1,r:0});
  }catch(e){dlg('読み込めませんでした','この画像は使えません。別の写真を選んでください。',[['とじる','pri']])}}
 ui()}
$('#file').onchange=e=>{addImages(e.target.files);e.target.value=''};
function addText(){
 const v=U.txt.trim();if(!v)return;const it={t:'txt',text:v,f:U.font,c:U.tc,o:U.outline,x:R,y:R,s:1,r:0};
 mc.font=fnt(it);it.s=Math.min(1,520/(mc.measureText(v).width+20));
 U.txt='';addItem(it);document.fonts.load(fnt(it),v).then(render)}
function dlg(title,body,btns,extra){
 const bx=$('#box');bx.innerHTML=`<h2>${title}</h2>${body?`<p>${body}</p>`:''}${extra||''}<div class="btns"></div>`;
 const w=bx.querySelector('.btns');
 btns.forEach(([l,k,fn,keep])=>{const b=document.createElement('button');b.textContent=l;b.className=k;b.onclick=()=>{if(!keep)$('#ov').classList.remove('on');fn&&fn()};w.appendChild(b)});
 $('#ov').classList.add('on')}
$('#done').onclick=exportA4;
$('#clr').onclick=()=>dlg('全部消しますか?','このバッジの絵・写真・文字・スタンプがすべて消えます。元に戻すボタンで戻せます。',[['全部消す','dan',()=>{const b=B();b.items=[];sel=null;commit();render()}],['やめる','sec']]);
$('#cnt').onclick=()=>{dlg('バッジを選ぶ・追加する','',S.badges.map((b,k)=>[`${k+1}個目を直す`+(k===S.cur?'(いま作成中)':''),k===S.cur?'pri':'sec',()=>{S.cur=k;sel=null;save();ui()}]).concat(S.badges.length<3?[['バッジを追加する','sec',()=>{S.badges.push(mk());S.cur=S.badges.length-1;sel=null;save();ui()}]]:[]).concat([['とじる','']]))};
$('#undo').onclick=()=>jump(-1);$('#redo').onclick=()=>jump(1);
$('#del').onclick=()=>{const b=B();b.items=b.items.filter(i=>i!==sel);sel=null;commit();render()};

async function exportA4(){
 dlg('画像を作っています','少しお待ちください。',[]);
 const W=2480,H=3508,mm=W/210,Dm=70*mm,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 for(const b of S.badges)for(const i of b.items){if(i.t==='txt')await document.fonts.load(fnt(i),i.text);if(i.src){const m=getImg(i.src);if(!m.complete)await new Promise(r=>{m.onload=r;m.onerror=r})}}
 [60,148.5,237].forEach((y,k)=>{const b=S.badges[k];if(!b)return;const cy=y*mm;
  x.save();x.translate(W/2-Dm/2,cy-Dm/2);draw(x,b,Dm);x.restore();
  x.lineWidth=3;x.strokeStyle='#777';x.beginPath();x.arc(W/2,cy,Dm/2,0,7);x.stroke()});
 c.toBlob(bl=>{const u=URL.createObjectURL(bl),f=new File([bl],'badge-print-A4.png',{type:'image/png'});
  const can=navigator.canShare&&navigator.canShare({files:[f]});
  dlg('印刷データができました','画像を長押しして「写真に追加」などで保存してください。印刷はA4・拡大縮小なし(100%)で行います。',
   [['共有・保存','pri',()=>{if(can){navigator.share({files:[f]}).catch(()=>{})}else{const a=document.createElement('a');a.href=u;a.download='badge-print-A4.png';document.body.appendChild(a);a.click();a.remove()}},1]]
   .concat([['編集にもどる','']]),
   `<img src="${u}" alt="A4印刷データ">`);
  // 保存ボタンはダイアログを閉じるので、再表示しない
 },'image/png')}

/* ---------- UI ---------- */
const lum=h=>{const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
const ck=h=>lum(h)>.4?'#000':'#fff';
const swatch=(a,c,on,l)=>`<button class="sw" data-a="${a}" data-v="${c}" aria-pressed="${on}" aria-label="${l||c}" style="background:${c};color:${ck(c)}">${on?'✓':''}</button>`;
const free=(id,v)=>`<label class="chip" style="display:inline-flex;align-items:center;gap:6px;border:2px solid var(--navy);border-radius:10px;min-height:44px;padding:0 10px">自由色<input type="color" id="${id}" value="${v}" style="width:32px;height:32px;border:0;padding:0;background:none"></label>`;
function ui(){
 const b=B();$('#cnt').textContent=`${S.cur+1}/3個目`;
 $('#undo').disabled=b.hi<=0;$('#redo').disabled=b.hi>=b.hist.length-1;$('#del').hidden=!(sel&&b.items.includes(sel));
 $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${U.tool===k}">${l}</button>`).join('');
 const t=U.tool;let h='';
 if(t==='pen')h=`<div class="row scr">${PEN.map(c=>swatch('color',c,!U.erase&&U.color===c)).join('')}</div>
 <div class="row scr">${SZN.map((l,i)=>`<button class="chip" data-a="size" data-v="${i}" aria-pressed="${U.size===i}">${l}</button>`).join('')}
 <button class="chip" data-a="erase" aria-pressed="${U.erase}">消しゴム</button>
 ${free('cc',U.color)}</div>`;
 if(t==='img')h=`<button class="pri" data-a="img">写真を選ぶ(あと${5-b.items.filter(i=>i.t==='img').length}枚)</button><p class="note">写真は何枚でも選べます。指でつまんで大きさや向きを変えられます。</p>`;
 if(t==='stp')h=`<div class="row scr">${STAMPS.map((s,i)=>`<button class="stp" data-a="stamp" data-v="${i}" aria-label="スタンプ${i+1}"><img src="${s}" alt=""></button>`).join('')}</div><p class="note">タップすると中央に置かれます。</p>`;
 if(t==='txt')h=`<div class="row"><input type="text" id="ti" placeholder="文字を入れる" maxlength="20" value="${U.txt.replace(/"/g,'&quot;')}" aria-label="文字"><button class="pri" data-a="add">追加</button></div>
 <div class="row scr">${FONTS.map((f,i)=>`<button class="chip" data-a="font" data-v="${i}" aria-pressed="${U.font===i}" style="font-family:'${f[0]}';font-weight:${f[1]}">${i+1} あいう</button>`).join('')}</div>
 <div class="row scr"><button class="chip" data-a="outline" aria-pressed="${U.outline}">白い縁取り</button>${PEN.map(c=>swatch('tc',c,U.tc===c)).join('')}${free('ct',U.tc)}</div>`;
 if(t==='bg')h=`<div class="row scr">${BGS.map(([n,c])=>swatch('bg',c,b.bg===c,n)).join('')}<button class="sw" data-a="bg" data-v="#FFFFFF" aria-pressed="${b.bg==='#FFFFFF'}" aria-label="白" style="background:#fff;color:#000">${b.bg==='#FFFFFF'?'✓':''}</button>${free('cb',b.bg)}</div>`;
 const pn=$('#panel'),sl=[...pn.querySelectorAll('.scr')].map(e=>e.scrollLeft),sy=pn.scrollTop,same=ui.t===t;ui.t=t;
 pn.innerHTML=h;if(same){pn.querySelectorAll('.scr').forEach((e,k)=>e.scrollLeft=sl[k]||0);pn.scrollTop=sy}
 fit();render()}
$('#tabs').onclick=e=>{const k=e.target.closest('[data-t]');if(!k)return;U.tool=k.dataset.t;if(U.tool==='pen')sel=null;ui()};
$('#panel').addEventListener('input',e=>{
 if(e.target.id==='ti'){U.txt=e.target.value;if(sel&&sel.t==='txt'&&B().items.includes(sel)){sel.text=U.txt;render();save()}}});
$('#panel').addEventListener('change',e=>{
 if(e.target.id==='ti'&&sel&&sel.t==='txt'){commit()}
 if(e.target.id==='cc'){U.color=e.target.value;U.erase=false;ui()}
 if(e.target.id==='ct'){U.tc=e.target.value;const q=sel;if(q&&q.t==='txt'&&B().items.includes(q)){q.c=U.tc;commit()}else ui()}
 if(e.target.id==='cb'){B().bg=e.target.value;commit()}});
$('#panel').addEventListener('keydown',e=>{if(e.target.id==='ti'&&e.key==='Enter')addText()});
$('#panel').onclick=e=>{
 const k=e.target.closest('[data-a]');if(!k)return;const a=k.dataset.a,v=k.dataset.v,b=B(),tx=sel&&sel.t==='txt'&&b.items.includes(sel)?sel:null;
 if(a==='color'){U.color=v;U.erase=false}
 else if(a==='size')U.size=+v;
 else if(a==='erase')U.erase=!U.erase;
 else if(a==='img')return $('#file').click();
 else if(a==='stamp'){const q=.01;addItem({t:'img',src:STAMPS[+v],w:264,h:264,x:R,y:R,s:1,r:0});return ui()}
 else if(a==='add')return addText();
 else if(a==='font'){U.font=+v;if(tx){tx.f=U.font;commit();document.fonts.load(fnt(tx),tx.text).then(render);return}}
 else if(a==='tc'){U.tc=v;if(tx){tx.c=v;commit();return}}
 else if(a==='outline'){U.outline=!U.outline;if(tx){tx.o=U.outline;commit();return}}
 else if(a==='bg'){b.bg=v;commit();return}
 ui()};

/* ---------- 初回説明 ---------- */
function intro(n){
 const T=[['バッジを作ろう','描く・写真・スタンプ・文字で、自由にデザインできます。作れるのは1人3個までです。'],['道具を切り替える','下のボタンで道具を切り替えます。写真・スタンプ・文字は、指でつまんで大きさや向きを変えられます。'],['点線の内側に入れる','点線の内側がバッジの表になります。大事な絵や文字は、点線の内側に入れてください。']];
 const[t,p]=T[n];dlg(`${n+1}/3 ${t}`,p,[[n<2?'つぎへ':'はじめる','pri',()=>n<2?intro(n+1):0],...(n<2?[['スキップ','sec']]:[])]);
 try{localStorage.setItem('kbj_seen','1')}catch(e){}}
let seen=false;try{seen=localStorage.getItem('kbj_seen')}catch(e){}
FONTS.forEach(f=>document.fonts.load(`${f[1]} 40px "${f[0]}"`,'あ').then(render).catch(()=>{}));
fit();ui();if(!seen)intro(0);
</script>
